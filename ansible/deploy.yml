# Build and deploy the Regex Pattern Tester application
- name: Build and deploy Regex Pattern Tester
  hosts: local
  connection: local
  gather_facts: false

  tasks:
    # Check the Python application for syntax errors
    - name: Check Python syntax
      ansible.builtin.command:
        cmd: python3 -m py_compile ../app/app.py
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false

    # Build the Docker image using the new project name
    - name: Build Docker image
      ansible.builtin.command:
        cmd: docker build -t regex-pattern-tester:v1 ../app
      args:
        chdir: "{{ playbook_dir }}"

    # Load the image into the new Minikube profile
    - name: Load image into regex-fresh
      ansible.builtin.command:
        cmd: minikube -p regex-fresh image load regex-pattern-tester:v1

    # Apply the Deployment specifically to regex-fresh
    - name: Apply Kubernetes deployment
      ansible.builtin.command:
        cmd: kubectl --context=regex-fresh apply -f ../k8s/deployment.yaml
      args:
        chdir: "{{ playbook_dir }}"

    # Apply the Service specifically to regex-fresh
    - name: Apply Kubernetes service
      ansible.builtin.command:
        cmd: kubectl --context=regex-fresh apply -f ../k8s/service.yaml
      args:
        chdir: "{{ playbook_dir }}"

    # Wait for the new cluster's Deployment to finish rolling out
    - name: Wait for rollout
      ansible.builtin.command:
        cmd: kubectl --context=regex-fresh rollout status deployment/devops-flask --timeout=180s
      changed_when: false

    # Retrieve pods from the new cluster
    - name: Show pods
      ansible.builtin.command:
        cmd: kubectl --context=regex-fresh get pods
      register: pods
      changed_when: false

    # Display the pod status
    - name: Display pods
      ansible.builtin.debug:
        var: pods.stdout
