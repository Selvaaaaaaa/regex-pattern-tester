
---
- name: Build and deploy Regex Pattern Tester
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_name: regex-pattern-tester
    image_tag: v1
    image_full: "{{ image_name }}:{{ image_tag }}"
    minikube_profile: regex-fresh
    deployment_name: devops-flask
    service_name: devops-flask-service

  tasks:

    # 1. Check Python syntax before building the image
    - name: Check Python syntax
      command: python3 -m py_compile ../app/app.py
      args:
        chdir: "{{ playbook_dir }}"

    # 2. Build the Docker image from the app directory
    - name: Build Docker image
      command: docker build -t {{ image_full }} ../app
      args:
        chdir: "{{ playbook_dir }}"

    # 3. Load the image into the existing regex-fresh Minikube cluster
    # Run the dedicated wrapper as the selvaa user
    - name: Load image into regex-fresh
      command: sudo -n -u selvaa /usr/local/sbin/jenkins-regex-minikube-load

    # 4. Apply the Kubernetes Deployment manifest
    # The wrapper explicitly uses the regex-fresh context
    - name: Apply deployment to regex-fresh
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        apply -f ../k8s/deployment.yaml
      args:
        chdir: "{{ playbook_dir }}"

    # 5. Apply the Kubernetes Service manifest
    - name: Apply service to regex-fresh
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        apply -f ../k8s/service.yaml
      args:
        chdir: "{{ playbook_dir }}"

    # 6. Wait until the Deployment rollout completes
    - name: Wait for deployment rollout
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        rollout status deployment/{{ deployment_name }}
        --timeout=180s

    # 7. Display the Deployment status
    - name: Verify deployment
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        get deployment {{ deployment_name }}

    # 8. Display the running Pods
    - name: Verify pods
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        get pods

    # 9. Display the Service
    - name: Verify service
      command: >
        sudo -n -u selvaa
        /usr/local/sbin/jenkins-regex-kubectl
        get service {{ service_name }}
