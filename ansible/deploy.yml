---
- name: Build and deploy Regex Pattern Tester
  hosts: local
  connection: local
  gather_facts: false
  tasks:
    - name: Check Python syntax
      ansible.builtin.command:
        cmd: python3 -m py_compile ../app/app.py
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false
    - name: Build Docker image
      ansible.builtin.command:
        cmd: docker build -t devops-flask-app:v1 ../app
      args:
        chdir: "{{ playbook_dir }}"
    - name: Load image into Minikube
      ansible.builtin.command:
        cmd: sudo -n -u selvaa /usr/local/sbin/jenkins-minikube-image-load
    - name: Apply Kubernetes deployment
      ansible.builtin.command:
        cmd: kubectl apply -f ../k8s/deployment.yaml
      args:
        chdir: "{{ playbook_dir }}"
    - name: Apply Kubernetes service
      ansible.builtin.command:
        cmd: kubectl apply -f ../k8s/service.yaml
      args:
        chdir: "{{ playbook_dir }}"
    - name: Wait for rollout
      ansible.builtin.command:
        cmd: kubectl rollout status deployment/devops-flask --timeout=180s
      changed_when: false
    - name: Show pods
      ansible.builtin.command:
        cmd: kubectl get pods
      register: pods
      changed_when: false
    - name: Display pods
      ansible.builtin.debug:
        var: pods.stdout
